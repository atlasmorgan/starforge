<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <radialGradient id="bg" cx="38%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="45%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#92400e"/>
    </radialGradient>
    <radialGradient id="starglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="40%" stop-color="#fef9c3" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="outerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- outer ambient glow -->
  <circle cx="50" cy="50" r="48" fill="#fbbf24" opacity="0.18" filter="url(#outerGlow)"/>
  <!-- main golden circle -->
  <circle cx="50" cy="50" r="44" fill="url(#bg)"/>
  <!-- glow bloom behind star -->
  <circle cx="50" cy="50" r="20" fill="url(#starglow)" opacity="0.7"/>
  <!-- 5-pointed star -->
  <path d="M50,28 L55.29,42.72 L70.92,43.2 L58.56,52.78 L62.93,67.8 L50,59 L37.07,67.8 L41.44,52.78 L29.08,43.2 L44.71,42.72 Z"
        fill="#ffffff" filter="url(#glow)" opacity="0.95"/>
  <!-- tiny sparkle dots -->
  <circle cx="50" cy="24" r="1.5" fill="#fff" opacity="0.8"/>
  <circle cx="62" cy="30" r="1.2" fill="#fff" opacity="0.6"/>
  <circle cx="38" cy="30" r="1.2" fill="#fff" opacity="0.6"/>
</svg>
