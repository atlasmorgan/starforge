<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Star Forge</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <style>
    * { touch-action: manipulation; }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 20px rgba(251, 191, 36, 0.4); }
      50%       { box-shadow: 0 0 40px rgba(251, 191, 36, 0.8); }
    }
    .star-btn { animation: pulse-glow 2s ease-in-out infinite; }
    .star-btn:active { transform: scale(0.95); }
    #username-modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.75);
      display: flex; align-items: center; justify-content: center; z-index: 50;
    }
    #username-modal.hidden { display: none; }
    .lb-gold   { color: #fbbf24; }
    .lb-silver { color: #94a3b8; }
    .lb-bronze { color: #b45309; }
    #intro-overlay {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      cursor: pointer;
    }
    #intro-logo {
      max-width: 480px;
      width: 80vw;
      opacity: 0;
      transition: opacity 1.2s ease;
    }
    #intro-tap {
      color: #fbbf24;
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      text-shadow: 0 0 20px rgba(251, 191, 36, 0.8);
      border: 2px solid rgba(251, 191, 36, 0.6);
      padding: 0.6rem 1.4rem;
      border-radius: 0.5rem;
      animation: intro-blink 1.4s ease-in-out infinite;
    }
    @keyframes intro-blink {
      0%, 100% { opacity: 0.6; }
      50%       { opacity: 0.15; }
    }
  </style>
</head>
<body class="text-white min-h-screen" style="background: linear-gradient(to bottom right, #0f2027, #203a43, #2c5364);">

  <!-- ═══ INTRO OVERLAY ════════════════════════════════════════════════════ -->
  <div id="intro-overlay">
    <img id="intro-logo" src="assets/flame-games-logo.png" alt="Flame Games" />
    <span id="intro-tap">CLICK TO ENABLE SOUND (REQUIRED)</span>
  </div>

  <!-- ═══ USERNAME MODAL ════════════════════════════════════════════════════ -->
  <div id="username-modal" class="hidden">
    <div class="bg-slate-800 border border-white/10 rounded-2xl px-8 py-8 flex flex-col items-center gap-5 shadow-2xl max-w-xs w-full mx-4">
      <div class="text-3xl">⭐</div>
      <h2 class="text-xl font-bold text-yellow-400 text-center">Choose your name</h2>
      <p class="text-sm text-gray-400 text-center">This will appear on the leaderboard.</p>
      <input
        id="username-input"
        type="text"
        maxlength="20"
        placeholder="Your name..."
        class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-500 text-center focus:outline-none focus:border-yellow-400"
      />
      <button
        onclick="confirmUsername()"
        class="w-full py-3 rounded-xl bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold transition"
      >
        Start Forging
      </button>
    </div>
  </div>

  <!-- ═══ CLICKER VIEW ═══════════════════════════════════════════════════════ -->
  <div id="view-clicker" class="flex flex-col items-center justify-center min-h-screen gap-10 px-6">

    <h1 class="text-4xl font-bold text-yellow-400 tracking-wide">⭐ Star Forge ⭐️</h1>

    <!-- Energy display -->
    <div class="text-center">
      <div class="text-6xl font-extrabold text-yellow-300 tabular-nums" id="energy-display">0</div>
      <div class="text-lg text-gray-400 mt-2">
        <span id="eps-display" class="text-yellow-500">0.0</span>/s
      </div>
    </div>

    <!-- Big star button -->
    <button
      onclick="handleClick()"
      class="star-btn w-56 h-56 rounded-full bg-gradient-to-br from-yellow-400 to-amber-600
             text-8xl flex items-center justify-center shadow-xl
             transition hover:scale-110 active:scale-95 cursor-pointer select-none"
      aria-label="Click to forge energy"
    >
      🌟
    </button>

    <!-- Shop + Leaderboard buttons -->
    <div class="flex gap-4 mt-4">
      <button
        onclick="showShop()"
        class="px-8 py-4 rounded-2xl bg-slate-700 hover:bg-slate-600 active:scale-95
               text-xl font-bold text-white shadow-lg transition"
      >
        🛒 Shop
      </button>
      <button
        onclick="showLeaderboard()"
        class="px-8 py-4 rounded-2xl bg-slate-700 hover:bg-slate-600 active:scale-95
               text-xl font-bold text-white shadow-lg transition"
      >
        🏆 Ranks
      </button>
      <button
        id="music-toggle-btn"
        onclick="toggleMusic()"
        class="px-8 py-4 rounded-2xl bg-slate-700 hover:bg-slate-600 active:scale-95
               text-xl font-bold text-white shadow-lg transition"
      >
        🎵 Mute
      </button>
    </div>

    <!-- Rebirth section -->
    <div class="flex flex-col items-center gap-2">
      <div id="rebirth-info" class="text-sm text-purple-300"></div>
      <button
        id="rebirth-btn"
        onclick="handleRebirth()"
        class="px-10 py-4 rounded-2xl bg-purple-700 hover:bg-purple-600 active:scale-95
               text-xl font-bold text-white shadow-lg transition
               disabled:opacity-40 disabled:cursor-not-allowed"
      >
        🔄 Rebirth
      </button>
    </div>

  </div>

  <!-- ═══ SHOP VIEW ══════════════════════════════════════════════════════════ -->
  <div id="view-shop" class="hidden flex-col min-h-screen px-6 py-8 max-w-2xl mx-auto gap-6">

    <!-- Shop header -->
    <div class="flex items-center justify-between">
      <button
        onclick="showClicker()"
        class="px-5 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 active:scale-95
               text-base font-bold text-white shadow-lg transition"
      >
        ← Back
      </button>
      <h2 class="text-3xl font-bold text-yellow-400">🛒 Shop</h2>
      <div class="text-right">
        <div class="text-xl font-bold text-yellow-300 tabular-nums" id="energy-display-shop">0</div>
        <div class="text-sm text-gray-400"><span id="eps-display-shop" class="text-yellow-500">0.0</span>/s</div>
      </div>
    </div>

    <!-- Upgrade cards -->
    <div id="shop" class="flex flex-col gap-3 flex-1 overflow-y-auto"></div>

  </div>

  <!-- ═══ LEADERBOARD VIEW ═════════════════════════════════════════════════ -->
  <div id="view-leaderboard" class="hidden flex-col min-h-screen px-6 py-8 max-w-2xl mx-auto gap-6">
    <div class="flex items-center justify-between">
      <button
        onclick="showClicker()"
        class="px-5 py-3 rounded-2xl bg-slate-700 hover:bg-slate-600 active:scale-95
               text-base font-bold text-white shadow-lg transition"
      >
        ← Back
      </button>
      <h2 class="text-3xl font-bold text-yellow-400">🏆 Leaderboard</h2>
      <div class="text-right text-sm text-gray-400">
        Energy/sec
      </div>
    </div>
    <div id="leaderboard-list" class="flex flex-col gap-3"></div>
    <p class="text-xs text-gray-500 text-center" id="lb-last-updated"></p>
  </div>

  <!-- ═══ DEV PANEL ═ ═════════════════════════════════════════════════════════ -->
  <div id="dev-panel" class="hidden" style="position:fixed;bottom:20px;right:20px;z-index:100;
       background:rgba(15,20,30,0.95);border:1px solid rgba(251,191,36,0.4);
       border-radius:16px;padding:16px;display:none;flex-direction:column;gap:10px;min-width:220px;">
    <div class="text-yellow-400 font-bold text-sm">⚙️ Dev Mode</div>
    <div class="flex flex-col gap-1">
      <label class="text-xs text-gray-400">Energy / sec (1 – 1,000,000)</label>
      <input
        id="dev-eps-input"
        type="number" min="1" max="1000000" value="100"
        class="px-3 py-2 rounded-lg bg-white/10 border border-white/20 text-white text-sm
               focus:outline-none focus:border-yellow-400 tabular-nums"
      />
    </div>
    <button
      onclick="devSetEPS()"
      class="py-2 rounded-lg bg-yellow-500 hover:bg-yellow-400 text-gray-950 font-bold text-sm transition"
    >
      Set EPS
    </button>
    <button
      onclick="devClearEPS()"
      class="py-2 rounded-lg bg-slate-600 hover:bg-slate-500 text-white text-sm transition"
    >
      Clear Override
    </button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>
  <script>
    // ─── Upgrades config ───────────────────────────────────────────────────────
    const UPGRADES = [
      { name: "Solar Panel",       cost: 10,          perSecond: 0.1,     emoji: "🔆" },
      { name: "Photon Rain",       cost: 50,          perSecond: 0.5,     emoji: "🌧️"  },
      { name: "Star Miner",        cost: 100,         perSecond: 1,       emoji: "⛏️"  },
      { name: "Warp Drive",        cost: 200,         perSecond: 2,       emoji: "🚀" },
      { name: "Starfall Echo",     cost: 500,         perSecond: 5,       emoji: "🌠" },
      { name: "Gravity Whirlpool", cost: 8_000,       perSecond: 30,      emoji: "🌀" },
      { name: "Nebula Bloomstorm", cost: 30_000,      perSecond: 100,     emoji: "🌸" },
      { name: "Dark Matter Tide",  cost: 120_000,     perSecond: 350,     emoji: "🌊" },
      { name: "Time Fracture",     cost: 500_000,     perSecond: 1_200,   emoji: "⏳" },
      { name: "Magnetar Singing",  cost: 2_000_000,   perSecond: 4_000,   emoji: "🎵" },
      { name: "Void Lightning",    cost: 8_000_000,   perSecond: 13_000,  emoji: "⚡" },
      { name: "Comet Garden",      cost: 35_000_000,  perSecond: 45_000,  emoji: "☄️" },
      { name: "Aurora Planet",     cost: 150_000_000, perSecond: 150_000, emoji: "🪐" },
    ];

    // ─── Audio ─────────────────────────────────────────────────────────────────
    const clickSound = new Audio("assets/click.mp3");
    const chaChingSound = new Audio("assets/cha-ching.mp3");
    const bgMusic = new Audio("assets/bg-music.mp3");
    bgMusic.loop = true;
    bgMusic.volume = 0.4;
    let musicMuted = false;

    function toggleMusic() {
      musicMuted = !musicMuted;
      bgMusic.muted = musicMuted;
      document.getElementById("music-toggle-btn").textContent =
        musicMuted ? "🎵 Unmute" : "🎵 Mute";
    }

    // ─── Game state ────────────────────────────────────────────────────────────
    let energy = 0;
    let energyPerSecond = 0;
    const owned = UPGRADES.map(() => 0);

    // ─── Rebirth state ──────────────────────────────────────────────────────────
    const REBIRTH_COSTS = [
      1_000, 10_000, 75_000, 500_000, 3_000_000,
      20_000_000, 150_000_000, 1_000_000_000, 7_500_000_000,
      50_000_000_000, 400_000_000_000, 3_000_000_000_000
    ];
    let rebirthCount = 0;

    function getMultiplier() {
      return 1 + rebirthCount * 0.5;
    }

    // ─── View navigation ───────────────────────────────────────────────────────
    function showShop() {
      document.getElementById("view-clicker").classList.add("hidden");
      document.getElementById("view-shop").classList.remove("hidden");
      document.getElementById("view-shop").classList.add("flex");
    }

    // ─── handleClick ───────────────────────────────────────────────────────────
    function handleClick() {
      clickSound.currentTime = 0;
      clickSound.play();
      energy += 1 * getMultiplier();
      updateDisplay();
    }

    // ─── buyUpgrade ────────────────────────────────────────────────────────────
    function buyUpgrade(index) {
      const upgrade = UPGRADES[index];
      if (energy < upgrade.cost) return;
      chaChingSound.currentTime = 0;
      chaChingSound.play();
      energy -= upgrade.cost;
      owned[index] += 1;
      recalcEPS();
      updateDisplay();
      submitScore();
    }

    // ─── recalcEPS ─────────────────────────────────────────────────────────────
    let devEPSBonus = 0;
    function recalcEPS() {
      const real = UPGRADES.reduce((sum, u, i) => sum + owned[i] * u.perSecond, 0);
      energyPerSecond = real + devEPSBonus;
    }

    // ─── tick ──────────────────────────────────────────────────────────────────
    function tick() {
      if (energyPerSecond > 0) {
        energy += (energyPerSecond * getMultiplier()) / 10;
        updateDisplay();
      }
    }

    // ─── updateDisplay ─────────────────────────────────────────────────────────
    // Updates both views' energy/EPS counters and the shop buttons.
    function updateDisplay() {
      const val = Math.floor(energy).toLocaleString();
      const eps = energyPerSecond.toFixed(1);
      document.getElementById("energy-display").textContent      = val;
      document.getElementById("energy-display-shop").textContent = val;
      document.getElementById("eps-display").textContent         = eps;
      document.getElementById("eps-display-shop").textContent    = eps;

      UPGRADES.forEach((u, i) => {
        const btn   = document.getElementById(`buy-btn-${i}`);
        const badge = document.getElementById(`owned-badge-${i}`);
        if (btn)   btn.disabled = energy < u.cost;
        if (badge) badge.textContent = owned[i];
      });

      const rebirthBtn  = document.getElementById("rebirth-btn");
      const rebirthInfo = document.getElementById("rebirth-info");
      if (rebirthBtn && rebirthInfo) {
        if (rebirthCount >= 12) {
          rebirthBtn.disabled = true;
          rebirthBtn.textContent = "MAX REBIRTH";
          rebirthInfo.textContent = `Rebirth ${rebirthCount}/12 · ${getMultiplier()}× multiplier`;
        } else {
          const cost = REBIRTH_COSTS[rebirthCount];
          rebirthBtn.disabled = energy < cost;
          rebirthBtn.textContent = `🔄 Rebirth (${cost.toLocaleString()} ⚡)`;
          rebirthInfo.textContent = `Rebirth ${rebirthCount}/12 · ${getMultiplier()}× multiplier`;
        }
      }
    }

    // ─── renderShop ────────────────────────────────────────────────────────────
    function renderShop() {
      document.getElementById("shop").innerHTML = UPGRADES.map((u, i) => `
        <div class="flex items-center justify-between bg-white/5 border border-white/10
                    rounded-2xl px-4 py-4 gap-4">
          <div class="flex items-center gap-3 min-w-0">
            <span class="text-4xl">${u.emoji}</span>
            <div>
              <div class="font-semibold text-gray-100 text-base">${u.name}</div>
              <div class="text-xs text-gray-400">
                +${u.perSecond}/s &nbsp;&middot;&nbsp;
                <span class="text-yellow-400">&#x26A1; ${u.cost.toLocaleString()}</span>
              </div>
            </div>
          </div>
          <span id="owned-badge-${i}"
                class="inline-flex items-center justify-center w-9 h-9 rounded-full
                       bg-slate-700 text-yellow-300 font-bold text-sm flex-shrink-0">
            0
          </span>
          <button
            id="buy-btn-${i}"
            onclick="buyUpgrade(${i})"
            disabled
            class="flex-shrink-0 px-5 py-3 rounded-xl font-bold text-sm
                   bg-yellow-500 hover:bg-yellow-400 text-gray-950
                   disabled:opacity-40 disabled:cursor-not-allowed transition"
          >
            Buy
          </button>
        </div>
      `).join("");
    }

    // ─── handleRebirth ─────────────────────────────────────────────────────────
    function handleRebirth() {
      const cost = REBIRTH_COSTS[rebirthCount];
      if (energy < cost || rebirthCount >= 12) return;
      rebirthCount += 1;
      energy = 0;
      owned.fill(0);
      recalcEPS();
      updateDisplay();
      saveGame();
    }

    // ─── Spacebar shortcut ─────────────────────────────────────────────────────
    document.addEventListener("keydown", (e) => {
      if (e.code === "Space" && e.target === document.body) {
        e.preventDefault();
        handleClick();
      }
    });

    // ─── Save / Load ───────────────────────────────────────────────────────────
    function saveGame() {
      localStorage.setItem("starforge_save", JSON.stringify({ energy, owned, rebirthCount, devEPSBonus }));
    }

    function loadGame() {
      const raw = localStorage.getItem("starforge_save");
      if (!raw) return;
      const save = JSON.parse(raw);
      energy = save.energy ?? 0;
      rebirthCount = save.rebirthCount ?? 0;
      devEPSBonus = save.devEPSBonus ?? 0;
      save.owned.forEach((n, i) => { if (i < owned.length) owned[i] = n; });
      recalcEPS();
    }

    // ─── Firebase ──────────────────────────────────────────────────────────────
    const firebaseConfig = {
      apiKey: "AIzaSyAG_BsKiZkMcWXjjBJ1nDEVivLiQRnygPE",
      authDomain: "starforge-83eab.firebaseapp.com",
      projectId: "starforge-83eab",
      storageBucket: "starforge-83eab.firebasestorage.app",
      messagingSenderId: "286371078416",
      appId: "1:286371078416:web:21ed3fa1cf26ad38758595"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    // ─── Username ──────────────────────────────────────────────────────────────
    let username = localStorage.getItem("starforge_username") || "";

    function setupUsername() {
      if (!username) {
        document.getElementById("username-modal").classList.remove("hidden");
        document.getElementById("username-input").focus();
      }
    }

    function confirmUsername() {
      const val = document.getElementById("username-input").value.trim();
      if (!val) return;
      username = val;
      localStorage.setItem("starforge_username", username);
      document.getElementById("username-modal").classList.add("hidden");
    }

    document.getElementById("username-input").addEventListener("keydown", (e) => {
      if (e.key === "Enter") confirmUsername();
    });

    // ─── Score submission ──────────────────────────────────────────────────────
    function submitScore() {
      if (!username || energyPerSecond <= 0) return;
      db.collection("leaderboard").doc(username).set({
        username,
        eps: energyPerSecond,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }).catch(() => {});
    }

    // ─── Leaderboard view ──────────────────────────────────────────────────────
    function showLeaderboard() {
      document.getElementById("view-clicker").classList.add("hidden");
      document.getElementById("view-leaderboard").classList.remove("hidden");
      document.getElementById("view-leaderboard").classList.add("flex");
      fetchLeaderboard();
    }

    function showClicker() {
      document.getElementById("view-shop").classList.add("hidden");
      document.getElementById("view-shop").classList.remove("flex");
      document.getElementById("view-leaderboard").classList.add("hidden");
      document.getElementById("view-leaderboard").classList.remove("flex");
      document.getElementById("view-clicker").classList.remove("hidden");
    }

    async function fetchLeaderboard() {
      const list = document.getElementById("leaderboard-list");
      list.innerHTML = `<p class="text-center text-gray-400 py-8">Loading...</p>`;
      try {
        const timeout = new Promise((_, reject) =>
          setTimeout(() => reject(new Error("timeout")), 8000)
        );
        const snap = await Promise.race([
          db.collection("leaderboard").orderBy("eps", "desc").limit(10).get(),
          timeout
        ]);
        if (snap.empty) {
          list.innerHTML = `<p class="text-center text-gray-400 py-8">No entries yet — be the first!</p>`;
          return;
        }
        const medals = ["lb-gold", "lb-silver", "lb-bronze"];
        list.innerHTML = snap.docs.map((doc, i) => {
          const d = doc.data();
          const colorClass = medals[i] || "text-gray-300";
          const rank = i === 0 ? "🥇" : i === 1 ? "🥈" : i === 2 ? "🥉" : `#${i + 1}`;
          const isMe = d.username === username;
          return `
            <div class="flex items-center justify-between bg-white/5 border ${isMe ? "border-yellow-400/60" : "border-white/10"}
                        rounded-2xl px-5 py-4 gap-4">
              <span class="text-2xl w-8 text-center">${rank}</span>
              <span class="flex-1 font-semibold ${colorClass} truncate">${d.username}${isMe ? " (you)" : ""}</span>
              <span class="text-yellow-300 font-bold tabular-nums">${Number(d.eps).toLocaleString(undefined, {maximumFractionDigits: 1})}/s</span>
            </div>`;
        }).join("");
        const now = new Date();
        document.getElementById("lb-last-updated").textContent =
          `Updated ${now.toLocaleTimeString()}`;
      } catch (e) {
        const msg = e.message === "timeout"
          ? "Timed out — check Firestore security rules (reads must be allowed)."
          : `Error: ${e.message}`;
        list.innerHTML = `<p class="text-center text-red-400 py-8">${msg}</p>`;
      }
    }

    // ─── Dev mode ─────────────────────────────────────────────────────────────
    const DEV_MODE = new URLSearchParams(window.location.search).has("att1e");

    function devSetEPS() {
      const target = Math.min(1_000_000, Math.max(1, Number(document.getElementById("dev-eps-input").value) || 1));
      const real = UPGRADES.reduce((sum, u, i) => sum + owned[i] * u.perSecond, 0);
      devEPSBonus = Math.max(0, target - real);
      recalcEPS();
      updateDisplay();
    }

    function devClearEPS() {
      devEPSBonus = 0;
      recalcEPS();
      updateDisplay();
    }

    if (DEV_MODE) {
      const panel = document.getElementById("dev-panel");
      panel.classList.remove("hidden");
      panel.style.display = "flex";
    }

    // ─── Intro sequence ────────────────────────────────────────────────────────
    function runIntro(onComplete) {
      const overlay = document.getElementById("intro-overlay");
      const logo    = document.getElementById("intro-logo");
      const tapHint = document.getElementById("intro-tap");
      const audio   = new Audio("assets/intro.wav");
      const FADE_MS = 1200;

      let done = false;
      function finish() {
        if (done) return;
        done = true;
        bgMusic.play().catch(() => {});
        logo.style.opacity = "0";
        setTimeout(() => { overlay.remove(); onComplete(); }, FADE_MS);
      }

      overlay.addEventListener("click", function start() {
        overlay.removeEventListener("click", start);
        tapHint.style.display = "none";

        // Two nested rAFs ensure the browser has painted opacity:0 before changing it,
        // which is required for the CSS transition to fire.
        requestAnimationFrame(() => requestAnimationFrame(() => {
          logo.style.opacity = "1";
        }));

        audio.addEventListener("ended", finish);

        // Fallback in case audio duration is unavailable or very short
        const fallback = setTimeout(finish, 8000);
        audio.play()
          .then(() => audio.addEventListener("loadedmetadata", () => {
            clearTimeout(fallback);
            // Set fallback precisely based on actual audio duration
            setTimeout(finish, (audio.duration * 1000) + 200);
          }))
          .catch(finish);
      });
    }

    // ─── Init ──────────────────────────────────────────────────────────────────
    loadGame();
    renderShop();
    updateDisplay();
    submitScore();
    setInterval(tick, 100);
    setInterval(saveGame, 10_000);
    setInterval(submitScore, 30_000);
    window.addEventListener("beforeunload", saveGame);

    runIntro(() => {
      setupUsername();
    });
  </script>
</body>
</html>
